name: "Vendor Domain List"

on:
  schedule:
    - cron: '0 0 1 * * '
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Vendor
        run: script/vendor

      # PRs opened by create-pull-request with the default GITHUB_TOKEN don't
      # trigger the CI workflow, so a data change that breaks lookups (like
      # CISA renaming its dotgov CSV headers) can merge untested. Run the
      # specs that read the vendored data here so a breaking update fails
      # this job instead of opening a PR.
      - name: Test vendored data
        run: bundle exec rspec spec/gman/identifier_spec.rb spec/gman/bin_spec.rb

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
            commit-message: Vendor domain list
            title: Vendor domain list
            add-paths: config/*