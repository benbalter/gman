inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - config/**/*
    - vendor/**/*

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Exclude:
    - lib/gman/importer.rb

Metrics/ClassLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Style/AccessModifierDeclarations:
  Exclude:
    - lib/gman/identifier.rb
